 
name: Build and deploy documentation

on:
  workflow_call:
    inputs:
      deploy-pages:
        description: Publish documentation to GitHub Pages
        required: false
        type: boolean
        default: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .
      - name: Build documentation
        run: bash scripts/build_docs.sh
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-docs
          path: docs/build/html/
          retention-days: 7
          if-no-files-found: error
      - name: Upload Pages artifact
        if: inputs.deploy-pages && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html/

  deploy-pages:
    needs: build-docs
    if: inputs.deploy-pages && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # Permissions are inherited from the calling job.
    # Pages deployment requires pages: write and id-token: write.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

