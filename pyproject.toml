[project]
name = "cicd-example"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
]

[dependency-groups]

dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sphinx>=9.2.0",
    "sphinx-rtd-theme>=3.1.0",
    "codespell>=2.4.3",
    "sphinxcontrib-bibtex>=2.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.codespell]
skip = './docs/build,*.lock,./notebooks,./examples/results'
count = true
quiet-level = 3
