workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH'

stages:
  - validate
  - build
  - deploy

default:
  image: python:3.13-bookworm
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install --group dev

lint:
  stage: validate
  script:
    - bash scripts/lint.sh

test:
  stage: validate
  script:
    - bash scripts/test.sh

build-docs:
  stage: build
  script:
    - bash scripts/build_docs.sh
  artifacts:
    name: sphinx-docs
    paths:
      - docs/build/html/
    expire_in: 7 days

deploy-pages:
  stage: deploy
  before_script: []
  needs:
    - job: build-docs
      artifacts: true
  script:
    - test -s docs/build/html/index.html
  pages:
    publish: docs/build/html
  environment:
    name: pages
    url: $CI_PAGES_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'